[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-foxnose"
version = "0.4.0"
description = "LangChain integration for FoxNose - the knowledge layer for RAG and AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "FoxNose"}]
requires-python = ">=3.10"
keywords = ["foxnose", "langchain", "rag", "ai", "retriever", "embeddings", "knowledge-base", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "foxnose-sdk>=0.8.1",
    "langchain-core>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-socket",
    # Pin exact version: new releases may add standard tests that break CI.
    "langchain-tests==1.1.9",
]
lint = [
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
"Homepage" = "https://foxnose.net"
"Documentation" = "https://langchain-foxnose.readthedocs.io"
"Repository" = "https://github.com/FoxNoseTech/langchain-foxnose"
"Issue Tracker" = "https://github.com/FoxNoseTech/langchain-foxnose/issues"
"Changelog" = "https://langchain-foxnose.readthedocs.io/changelog/"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["langchain_foxnose"]

[tool.mypy]
# No `python_version` pin on purpose. Pinning it to our 3.10 floor makes mypy
# parse third-party stubs under 3.10 rules, and numpy >= 2.3 (pulled in
# transitively by langchain-tests) ships stubs using PEP 695 `type X = ...`,
# which is 3.12-only syntax -- so `mypy src/` dies on numpy's stubs in any
# environment that has both extras installed, which is what CONTRIBUTING and
# `make install` tell contributors to do. The 3.10 floor is enforced where it
# actually matters instead: ruff's `target-version = "py310"` above, and the
# CI matrix, which really runs the test suite on 3.10.
disallow_untyped_defs = true
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["foxnose_sdk.*"]
ignore_missing_imports = true

